name: Dispatch Reminders

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch endpoint
        run: |
          curl --location --fail-with-body --show-error --silent -X POST https://revive-gilt.vercel.app/api/reminders/dispatch \
            -H "Authorization: Bearer ${{ secrets.REMINDER_CRON_SECRET }}"
